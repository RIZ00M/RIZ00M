name: Refresh contribution heatmap

on:
  schedule:
    - cron: "17 3 * * *"      # daily, 03:17 UTC
  workflow_dispatch:           # "Run workflow" button, for the first run

permissions:
  contents: write              # lets the job push its own commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_USER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/fetch_contributions.py
      - run: python scripts/heatmap.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg data/contributions.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh contribution heatmap [skip ci]"
            git push
          fi
