<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131a24"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1c2431" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="1000" height="220" rx="12" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="220" rx="12" fill="url(#grid)"/>
  <rect x="0" y="0" width="1000" height="220" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="0" y="0" width="1000" height="40" rx="12" fill="#161b22"/>
  <rect x="0" y="28" width="1000" height="12" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6" fill="#27c93f"/>
  <text x="500" y="25" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8b949e">riz00m@github: ~/whoami</text>

  <!-- prompt lines -->
  <text x="36" y="85" font-family="Menlo, Consolas, monospace" font-size="20" fill="#27c93f">riz00m@github<tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>

  <text x="36" y="125" font-family="Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#e6edf3">RIZ00M</text>
  <rect x="205" y="103" width="3" height="26" fill="#27c93f">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="36" y="160" font-family="Menlo, Consolas, monospace" font-size="15" fill="#8b949e">
    <tspan fill="#58a6ff">Branch</tspan> Cyber Security  <tspan fill="#3f3f46">│</tspan>  <tspan fill="#58a6ff">Path</tspan> Aspiring Security Engineer  <tspan fill="#3f3f46">│</tspan>  <tspan fill="#58a6ff">Focus</tspan> Purple Team
  </text>

  <!-- accent palette strip -->
  <g transform="translate(36,182)">
    <rect x="0" y="0" width="18" height="6" rx="1" fill="#8b949e"/>
    <rect x="24" y="0" width="18" height="6" rx="1" fill="#ff5f56"/>
    <rect x="48" y="0" width="18" height="6" rx="1" fill="#27c93f"/>
    <rect x="72" y="0" width="18" height="6" rx="1" fill="#ffbd2e"/>
    <rect x="96" y="0" width="18" height="6" rx="1" fill="#58a6ff"/>
    <rect x="120" y="0" width="18" height="6" rx="1" fill="#a371f7"/>
    <rect x="144" y="0" width="18" height="6" rx="1" fill="#39c5cf"/>
    <rect x="168" y="0" width="18" height="6" rx="1" fill="#e6edf3"/>
  </g>
</svg>
